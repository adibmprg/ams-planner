<!doctype html><html><head><meta charset="utf-8"><title>AMS Planner</title>
<style>
body{font:14px -apple-system,Helvetica,Arial,sans-serif;margin:0;background:#f6f6f4;color:#1d1d1b}
header{background:#1d1d1b;color:#fff;padding:12px 24px;font-weight:600;font-size:16px}
main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px 24px}
section{background:#fff;border:1px solid #ddd;border-radius:8px;padding:14px}
h2{font-size:14px;margin:0 0 10px}
#drop{border:2px dashed #aaa;border-radius:8px;padding:18px;text-align:center;color:#666}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #eee;padding:5px;text-align:left;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid #ccc;border-radius:12px;padding:1px 8px;margin:1px;font-size:12px;cursor:pointer;background:#fff}
.sw{width:12px;height:12px;border-radius:50%;border:1px solid #888;display:inline-block}
.miss{color:#b3261e;font-size:12px}.slot{display:flex;gap:6px;align-items:center;margin:4px 0}
button{background:#2b6cb0;color:#fff;border:0;border-radius:6px;padding:7px 14px;cursor:pointer}
select,input{font-size:13px;padding:3px}.kpi{display:flex;gap:12px}.kpi div{background:#f1f5fb;border-radius:6px;padding:8px 12px}
.kpi b{display:block;font-size:18px}
</style></head><body>
<header>AMS Planner &mdash; filament-aware print sequencing (AMS lite, 4 slots)</header>
<main>
<section><h2>1. Print jobs</h2>
<div id="drop">Drop .gcode, .gcode.3mf or .3mf files here, or <input type="file" id="fi" multiple></div>
<table id="jobs"><thead><tr><th>Job / plate</th><th>Filaments</th><th>Source</th><th>Est. time</th></tr></thead><tbody></tbody></table>
<p><button onclick="addManual()">+ Add job manually</button></p></section>
<section><h2>2. Filament history (click to add to selected job)</h2><div id="hist"></div>
<p>New filament: <select id="nt"><option>PLA</option><option>PETG</option><option>ABS</option><option>ASA</option><option>TPU</option><option>PLA-CF</option></select>
<input type="color" id="nc" value="#ff0000"> <input id="nl" placeholder="label (optional)"> <button onclick="newFil()">Save</button></p>
<h2>3. Current AMS content</h2><div id="ams"></div></section>
<section style="grid-column:1/3"><h2>4. Plan</h2>
Method <select id="m"><option value="ga">Genetic algorithm</option><option value="ils">Iterated local search</option><option value="greedy">Greedy</option><option value="fifo">FIFO (as listed)</option></select>
<button onclick="run()">Compute print order</button>
<div id="out"></div></section></main>
<script>
let jobs=[],hist=[],sel=-1;
const sw=k=>{const[c]=[k.split(':')[1]];return `<span class="sw" style="background:${c&&c[0]=='#'?c:'#fff'}"></span>`};
const chip=(k,cb)=>`<span class="chip" ${cb?`onclick="${cb}"`:''}>${sw(k)}${k}</span>`;
const fmt=s=>s==null?'?':(s>=3600?Math.floor(s/3600)+'h ':'')+Math.round(s%3600/60)+'m';
async function loadHist(){const keep=[1,2,3,4].map(i=>{const e=document.getElementById('s'+i);return e?e.value:''});hist=await (await fetch('/api/history')).json();
 document.getElementById('hist').innerHTML=hist.map(h=>chip(h.key,`addTo('${h.key}')`)+`<small>${h.uses}×</small>`).join(' ')||'<i>empty</i>';
 document.getElementById('ams').innerHTML=[1,2,3,4].map(i=>`<div class="slot">Slot ${i} <select id="s${i}"><option value="">(empty)</option>${hist.map(h=>`<option ${keep[i-1]==h.key?'selected':''}>${h.key}</option>`).join('')}</select></div>`).join('');}
function render(){document.querySelector('#jobs tbody').innerHTML=jobs.map((j,i)=>`<tr onclick="sel=${i};render()" style="background:${i==sel?'#eef4ff':''}"><td>${j.name}</td><td>${j.filaments.map(k=>chip(k,`rm(${i},'${k}')`)).join('')}${j.missing.filter(m=>!m.includes('time')).length?`<div class="miss">missing: ${j.missing.join(', ')} &mdash; select job, then click history</div>`:''}</td><td>${j.source}</td><td>${fmt(j.est_time_s)}</td></tr>`).join('')}
function addTo(k){if(sel<0)return alert('Select a job first');const j=jobs[sel];j.filaments=j.filaments.filter(x=>!x.includes('?'));if(!j.filaments.includes(k))j.filaments.push(k);j.missing=j.missing.filter(m=>m.includes('time'));render()}
function rm(i,k){event.stopPropagation();jobs[i].filaments=jobs[i].filaments.filter(x=>x!=k);render()}
function addManual(){jobs.push({name:'Manual job '+(jobs.length+1),filaments:[],source:'manual',missing:['filaments'],est_time_s:null});sel=jobs.length-1;render()}
async function newFil(){await fetch('/api/history',{method:'POST',body:JSON.stringify({type:nt.value,color:nc.value,label:nl.value})});loadHist()}
async function upload(files){const arr=await Promise.all([...files].map(f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r({name:f.name,b64:fr.result.split(',')[1]});fr.readAsDataURL(f)})));
 const res=await (await fetch('/api/parse',{method:'POST',body:JSON.stringify({files:arr})})).json();if(res.error)return alert(res.error);jobs.push(...res);render()}
fi.onchange=e=>upload(e.target.files);drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();upload(e.dataTransfer.files)};
async function run(){const initial=[1,2,3,4].map(i=>document.getElementById('s'+i).value).filter(x=>x);
 const r=await (await fetch('/api/plan',{method:'POST',body:JSON.stringify({jobs,initial,method:m.value})})).json();if(r.error)return alert(r.error);
 const save=r.fifo_total_s-r.total_s;
 out.innerHTML=`<div class="kpi"><div><b>${r.total_s.toFixed(0)} s</b>changeover time</div><div><b>${r.events}</b>operator visits</div><div><b>${r.swaps}</b>spools exchanged</div><div><b>${save.toFixed(0)} s</b>saved vs FIFO (${r.fifo_total_s.toFixed(0)} s, ${r.fifo_events} visits)</div></div>
 <table><tr><th>#</th><th>Job</th><th>Before printing</th><th>AMS slots 1-4</th></tr>${r.steps.map((s,n)=>`<tr><td>${n+1}</td><td>${s.job}</td><td>${s.actions.length?s.actions.map(a=>`slot ${a[0]}: ${a[1]?'remove '+a[1]:''} ${a[2]?'&rarr; load '+chip(a[2]):''}`).join('<br>'):'<i>no change</i>'}</td><td>${s.slots.map(x=>x?chip(x):'&ndash;').join('')}</td></tr>`).join('')}</table>`;loadHist()}
loadHist();
</script></body></html>
